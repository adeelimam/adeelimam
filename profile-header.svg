<svg width="1200" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A"/>
      <stop offset="50%" style="stop-color:#1E3A5F"/>
      <stop offset="100%" style="stop-color:#0F172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="50%" style="stop-color:#0891B2"/>
      <stop offset="100%" style="stop-color:#6366F1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)" rx="12"/>
  
  <!-- Decorative elements -->
  <circle cx="150" cy="80" r="120" fill="#3B82F6" opacity="0.08"/>
  <circle cx="1050" cy="220" r="150" fill="#6366F1" opacity="0.06"/>
  <circle cx="600" cy="50" r="80" fill="#0891B2" opacity="0.05"/>
  
  <!-- Grid pattern -->
  <g opacity="0.1">
    <line x1="0" y1="75" x2="1200" y2="75" stroke="#3B82F6" stroke-width="0.5"/>
    <line x1="0" y1="150" x2="1200" y2="150" stroke="#3B82F6" stroke-width="0.5"/>
    <line x1="0" y1="225" x2="1200" y2="225" stroke="#3B82F6" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="300" stroke="#3B82F6" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="300" stroke="#3B82F6" stroke-width="0.5"/>
    <line x1="900" y1="0" x2="900" y2="300" stroke="#3B82F6" stroke-width="0.5"/>
  </g>
  
  <!-- Name -->
  <text x="600" y="120" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="52" fill="white">Adeel Imam</text>
  
  <!-- Accent line -->
  <rect x="400" y="140" width="400" height="3" fill="url(#accent)" rx="2"/>
  
  <!-- Title -->
  <text x="600" y="185" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="22" fill="#94A3B8">Full-Stack Developer &amp; SaaS Builder</text>
  
  <!-- Tech badges -->
  <rect x="280" y="215" width="100" height="32" rx="16" fill="#3B82F6" opacity="0.2" stroke="#3B82F6" stroke-width="1"/>
  <text x="330" y="236" text-anchor="middle" font-family="Arial" font-size="13" font-weight="600" fill="#93C5FD">Next.js</text>
  
  <rect x="400" y="215" width="110" height="32" rx="16" fill="#0891B2" opacity="0.2" stroke="#0891B2" stroke-width="1"/>
  <text x="455" y="236" text-anchor="middle" font-family="Arial" font-size="13" font-weight="600" fill="#67E8F9">TypeScript</text>
  
  <rect x="530" y="215" width="110" height="32" rx="16" fill="#6366F1" opacity="0.2" stroke="#6366F1" stroke-width="1"/>
  <text x="585" y="236" text-anchor="middle" font-family="Arial" font-size="13" font-weight="600" fill="#A5B4FC">AI / LLMs</text>
  
  <rect x="660" y="215" width="100" height="32" rx="16" fill="#10B981" opacity="0.2" stroke="#10B981" stroke-width="1"/>
  <text x="710" y="236" text-anchor="middle" font-family="Arial" font-size="13" font-weight="600" fill="#6EE7B7">SaaS</text>
  
  <rect x="780" y="215" width="110" height="32" rx="16" fill="#F59E0B" opacity="0.2" stroke="#F59E0B" stroke-width="1"/>
  <text x="835" y="236" text-anchor="middle" font-family="Arial" font-size="13" font-weight="600" fill="#FCD34D">DevOps</text>
</svg>
